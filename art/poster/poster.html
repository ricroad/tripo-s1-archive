<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  /* 1080 x 1920 (9:16). ?v=A (the climb: moon top-left, text right) | ?v=B (the doorstep: moon top-right, text left) */
  :root { --moon: #cfe3e6; --sub: #a9b6c4; --tape: #c9b48a; --ink: #20242c; }
  html, body { margin: 0; background: #070a14; }
  .poster { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070a14; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade-top { position: absolute; left: 0; right: 0; top: 0; height: 640px; background: linear-gradient(to bottom, rgba(7,10,20,.72), rgba(7,10,20,.35) 55%, rgba(7,10,20,0)); }
  .shade-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(to top, rgba(7,10,20,.88), rgba(7,10,20,.5) 55%, rgba(7,10,20,0)); }
  .head { position: absolute; top: 118px; width: 600px; color: var(--moon); }
  .A .head { right: 76px; text-align: right; }
  .B .head { left: 76px; text-align: left; }
  .kicker { margin: 0 0 26px; font: 500 21px/1 "IBM Plex Mono", monospace; letter-spacing: .32em; color: var(--sub); }
  h1 { margin: 0; font: 600 112px/0.94 "Cormorant Garamond", Georgia, serif; letter-spacing: -.005em; color: var(--moon); text-shadow: 0 2px 24px rgba(4,6,15,.7); }
  .zh { margin: 22px 0 0; font: 500 50px/1.2 "Noto Serif SC", "Songti SC", serif; letter-spacing: .26em; color: var(--moon); text-shadow: 0 2px 16px rgba(4,6,15,.7); }
  .A .zh { margin-right: -.26em; }
  .line { margin: 30px 0 0; font: italic 500 30px/1.38 "Cormorant Garamond", Georgia, serif; color: var(--sub); text-shadow: 0 1px 12px rgba(4,6,15,.9); }
  .foot { position: absolute; left: 76px; right: 76px; bottom: 74px; display: flex; justify-content: space-between; align-items: flex-end; color: var(--sub); font: 400 19px/1.5 "IBM Plex Mono", monospace; letter-spacing: .06em; }
  .foot b { display: block; font-weight: 500; color: var(--moon); letter-spacing: .08em; }
  .foot .r { text-align: right; }
  .tape { position: absolute; padding: 10px 26px 8px; background: var(--tape); color: var(--ink); font: 600 40px/1 "Caveat", cursive; transform: rotate(-3deg); box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: .93; }
  .tape::before, .tape::after { content: ""; position: absolute; top: 0; bottom: 0; width: 7px; background: repeating-linear-gradient(to bottom, var(--tape) 0 6px, transparent 6px 10px); }
  .tape::before { left: -6px; } .tape::after { right: -6px; }
  .A .tape { left: 92px; bottom: 300px; }
  .B .tape { right: 96px; bottom: 300px; transform: rotate(2.5deg); }
</style>
</head>
<body>
<div class="poster" id="poster">
  <img class="art" id="art" alt="">
  <div class="shade-top"></div><div class="shade-bot"></div>
  <div class="head">
    <p class="kicker">A GIFT FOR YUE</p>
    <h1>The 300-Year<br>Bloom</h1>
    <p class="zh">三百年的昙花</p>
    <p class="line">He spent three hundred years turning a dead planet into a flowerpot, for the one seed she brought.</p>
  </div>
  <div class="tape">Yue’s. Year 300.</div>
  <div class="foot">
    <div><b>A first-person walk, played in the browser</b>ricroad.github.io/the-300-year-bloom</div>
    <div class="r"><b>Tripothon S1</b>2026</div>
  </div>
</div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'A';
  document.getElementById('poster').classList.add(v);
  document.getElementById('art').src = v === 'B' ? 'art-doorstep-9x16.png' : 'art-climb-9x16.png';
</script>
</body>
</html>
